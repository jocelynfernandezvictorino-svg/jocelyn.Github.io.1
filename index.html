<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solver Matriz 3x4 Rosa</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:linear-gradient(135deg,#ffe4ec,#ffc1d6);
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:25px;
    box-shadow:0px 0px 20px rgba(255,105,180,0.4);
}

h1{
    text-align:center;
    color:#d63384;
}

p{
    text-align:center;
    color:#c2185b;
}

.matrix{
    display:grid;
    grid-template-columns:repeat(4,80px);
    gap:10px;
    justify-content:center;
    margin-top:20px;
    margin-bottom:20px;
}

.matrix input{
    width:80px;
    height:55px;
    font-size:20px;
    text-align:center;
    border-radius:12px;
    border:2px solid #ff69b4;
    background:#fff0f7;
    color:#c2185b;
}

button{
    display:block;
    margin:auto;
    padding:12px 25px;
    border:none;
    border-radius:15px;
    background:#ff69b4;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff1493;
    transform:scale(1.05);
}

.step{
    background:#fff0f7;
    margin-top:20px;
    padding:15px;
    border-radius:20px;
    border:2px solid #ffb6d9;
}

.step h3{
    text-align:center;
    color:#d63384;
}

table{
    margin:auto;
    border-collapse:collapse;
}

td{
    border:2px solid #ff69b4;
    padding:10px;
    width:60px;
    text-align:center;
    font-size:18px;
    background:white;
    color:#c2185b;
}

.resultado{
    margin-top:25px;
    background:#ffe4ec;
    padding:20px;
    border-radius:20px;
    text-align:center;
    font-size:22px;
    color:#d63384;
    font-weight:bold;
    border:2px solid #ff69b4;
}

</style>
</head>

<body>

<div class="container">

<h1>✨ Resolución de Matriz 3x4 ✨</h1>

<p>
Ingresa los valores de la matriz aumentada:
</p>

<div class="matrix">

<input type="number" id="a11">
<input type="number" id="a12">
<input type="number" id="a13">
<input type="number" id="a14">

<input type="number" id="a21">
<input type="number" id="a22">
<input type="number" id="a23">
<input type="number" id="a24">

<input type="number" id="a31">
<input type="number" id="a32">
<input type="number" id="a33">
<input type="number" id="a34">

</div>

<button onclick="resolver()">Resolver 💖</button>

<div id="pasos"></div>

<div id="resultado"></div>

</div>

<script>

function mostrarMatriz(matriz,titulo){

    let html = `
    <div class="step">
    <h3>${titulo}</h3>
    <table>
    `;

    matriz.forEach(fila=>{

        html += "<tr>";

        fila.forEach(valor=>{

            html += `<td>${Number(valor).toFixed(2)}</td>`;

        });

        html += "</tr>";

    });

    html += "</table></div>";

    document.getElementById("pasos").innerHTML += html;
}

function resolver(){

    document.getElementById("pasos").innerHTML = "";
    document.getElementById("resultado").innerHTML = "";

    let m = [

        [
            parseFloat(document.getElementById("a11").value),
            parseFloat(document.getElementById("a12").value),
            parseFloat(document.getElementById("a13").value),
            parseFloat(document.getElementById("a14").value)
        ],

        [
            parseFloat(document.getElementById("a21").value),
            parseFloat(document.getElementById("a22").value),
            parseFloat(document.getElementById("a23").value),
            parseFloat(document.getElementById("a24").value)
        ],

        [
            parseFloat(document.getElementById("a31").value),
            parseFloat(document.getElementById("a32").value),
            parseFloat(document.getElementById("a33").value),
            parseFloat(document.getElementById("a34").value)
        ]

    ];

    mostrarMatriz(m,"🌸 Matriz Inicial");

    // R1

    let pivote1 = m[0][0];

    for(let j=0;j<4;j++){

        m[0][j] = m[0][j]/pivote1;

    }

    mostrarMatriz(m,"🌸 Paso R1");

    // R2

    let factor21 = m[1][0];

    for(let j=0;j<4;j++){

        m[1][j] = m[1][j] - factor21*m[0][j];

    }

    let pivote2 = m[1][1];

    for(let j=0;j<4;j++){

        m[1][j] = m[1][j]/pivote2;

    }

    mostrarMatriz(m,"🌸 Paso R2");

    // R3

    let factor31 = m[2][0];

    for(let j=0;j<4;j++){

        m[2][j] = m[2][j] - factor31*m[0][j];

    }

    let factor32 = m[2][1];

    for(let j=0;j<4;j++){

        m[2][j] = m[2][j] - factor32*m[1][j];

    }

    let pivote3 = m[2][2];

    for(let j=0;j<4;j++){

        m[2][j] = m[2][j]/pivote3;

    }

    mostrarMatriz(m,"🌸 Paso R3");

    // Sustitución hacia atrás

    m[1][3] = m[1][3] - m[1][2]*m[2][3];
    m[1][2] = 0;

    m[0][3] = m[0][3] - m[0][2]*m[2][3];
    m[0][2] = 0;

    m[0][3] = m[0][3] - m[0][1]*m[1][3];
    m[0][1] = 0;

    mostrarMatriz(m,"💖 Matriz Final Reducida");

    let a = m[0][3];
    let b = m[1][3];
    let c = m[2][3];

    document.getElementById("resultado").innerHTML = `

    <div class="resultado">

    💖 a = ${a.toFixed(2)} <br><br>

    💖 b = ${b.toFixed(2)} <br><br>

    💖 c = ${c.toFixed(2)}

    </div>

    `;
}

</script>

</body>
</html>
